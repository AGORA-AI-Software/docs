name: Bug report
description: Something is broken or inaccurate in the docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for flagging this. Please fill in as much detail as you can.
  - type: input
    id: page
    attributes:
      label: Affected page
      description: URL or path of the page with the issue.
      placeholder: https://docs.agoraai.tech/sdk/python/
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: Describe the inaccuracy, broken link, or misleading content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it say or do?
    validations:
      required: false
